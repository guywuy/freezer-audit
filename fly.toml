app = "freezer-audit"
primary_region = "lhr"
kill_signal = "SIGINT"
kill_timeout = 5

[experimental]
auto_rollback = true
cmd = "start.sh"
entrypoint = "sh"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"

[mounts]
source = "data"
destination = "/data"

[http_service]
internal_port = 8080
force_https = true
processes = [ "app" ]
# Suspend the machine when idle and resume it on the next request.
# Suspend needs no swap configured and <= 2 GB memory (the app peaks ~260 MB of 1 GB).
auto_stop_machines = "suspend"
auto_start_machines = true
min_machines_running = 0

  [http_service.concurrency]
  type = "connections"
  hard_limit = 25
  soft_limit = 20

  [[http_service.checks]]
  grace_period = "5s"
  interval = "10s"
  method = "GET"
  path = "/healthcheck"
  timeout = "2s"
